<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- icons (lucide-style, 2px stroke) ---------- */
const Ico = ({d, size=22, fill="none", extra, className, style}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className={className} style={style}>
    {d.map((p,i)=><path key={i} d={p} />)}
    {extra}
  </svg>
);
const IconFlag   = p => <Ico {...p} d={["M4 22V4","M4 4h11l-1.6 3.5L15 11H4"]} />;
const IconMinus  = p => <Ico {...p} d={["M5 12h14"]} />;
const IconPlus   = p => <Ico {...p} d={["M12 5v14","M5 12h14"]} />;
const IconTrophy = p => <Ico {...p} d={["M7 4h10v5a5 5 0 0 1-10 0z","M7 6H4v1a3 3 0 0 0 3 3","M17 6h3v1a3 3 0 0 1-3 3","M10 16h4","M12 14v2","M9 20h6"]} />;
const IconChev   = p => <Ico {...p} d={["m6 9 6 6 6-6"]} />;
const IconRotate = p => <Ico {...p} d={["M3 12a9 9 0 1 0 3-6.7L3 8","M3 3v5h5"]} />;
const IconUndo   = p => <Ico {...p} d={["M9 14 4 9l5-5","M4 9h11a5 5 0 0 1 0 10h-4"]} />;
const IconSwords = p => <Ico {...p} d={["M14.5 17.5 21 11l-1-4-4-1-6.5 6.5","M3 21l4.5-4.5","M6.5 6.5 3 3l1 4 4 1","M13 13l-6 6"]} />;
const IconUsers  = p => <Ico {...p} d={["M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2","M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8","M22 20v-2a4 4 0 0 0-3-3.9","M16 3.1a4 4 0 0 1 0 7.8"]} />;
const IconSave   = p => <Ico {...p} d={["M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z","M17 21v-8H7v8","M7 3v5h8"]} />;
const IconMapPin = p => <Ico {...p} d={["M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z", "M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"]} />;
const IconDownload = p => <Ico {...p} d={["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4","M7 10l5 5 5-5","M12 15V3"]} />;
const IconShare  = p => <Ico {...p} d={["M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8","M16 6l-4-4-4 4","M12 2v13"]} />;
const IconHistory= p => <Ico {...p} d={["M12 8v4l3 3","M22 12A10 10 0 1 1 12 2a10 10 0 0 1 10 10z"]} />;
const IconBack   = p => <Ico {...p} d={["M15 19l-7-7 7-7"]} />;
const IconShield = p => <Ico {...p} d={["M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"]} />;
const IconTrash  = p => <Ico {...p} d={["M3 6h18","M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2","M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6","M10 11v6","M14 11v6"]} />;
const IconAlert  = p => <Ico {...p} d={["M12 9v4","M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z","M12 17h.01"]} />;
const IconChevDown = p => <Ico {...p} d={["m6 9 6 6 6-6"]} />;

/* ---------- constants ---------- */
const IDS = ["A","B","C","D"];
const TURF = { A:"#146B3A", B:"#1F5F8B", C:"#8B4A1F", D:"#5C3B8B" };
const pairKey = (x,y) => x + "-" + y;
const allPairs = (ids) => {
  const out = [];
  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) out.push([ids[i],ids[j]]);
  return out;
};
const SCORE_NAME = { "-3":"알바트로스","-2":"이글","-1":"버디","0":"파","1":"보기","2":"더블보기","3":"트리플보기" };
const scoreLabel = n => SCORE_NAME[String(n)] || (n>0 ? `+${n}타` : `${n}타`);
const signed = n => (n>0 ? `+${n}` : n<0 ? `${n}` : "0"); 

/* ---------- core logic ---------- */
function hasHandicap(hcpObj) {
  if (!hcpObj) return false;
  return Object.values(hcpObj).some(h => h.giver !== null);
}

function judgePair(x, y, gross, hcp) {
  const h = hcp[pairKey(x,y)] || { giver:null, strokes:1 };
  let netX = gross[x], netY = gross[y];
  if (h.giver === x) netY = gross[y] - h.strokes;
  else if (h.giver === y) netX = gross[x] - h.strokes;
  const winner = netX < netY ? x : netY < netX ? y : null;
  return { x, y, netX, netY, winner, giver:h.giver, strokes:h.strokes };
}

function judgeHole(ids, gross, hcp) {
  const matches = allPairs(ids).map(([x,y]) => judgePair(x,y,gross,hcp));
  const tally = {};
  ids.forEach(id => tally[id] = { id, win:0, lose:0, tie:0, pts:0 });
  
  matches.forEach(m => {
    if (!m.winner) { tally[m.x].tie++; tally[m.y].tie++; return; }
    const loser = m.winner === m.x ? m.y : m.x;
    tally[m.winner].win++; tally[loser].lose++;
  });
  
  ids.forEach(id => tally[id].pts = tally[id].win - tally[id].lose);
  const pts = ids.map(id => tally[id].pts);
  const min = Math.min(...pts), max = Math.max(...pts);
  
  const bottom = ids.filter(id => tally[id].pts === min);
  const top    = ids.filter(id => tally[id].pts === max);
  const allSquare = (min === max);

  let finalLosers = [];
  if (!allSquare) {
    const bottomGross = bottom.map(id => gross[id]);
    const maxGrossInBottom = Math.max(...bottomGross); 
    finalLosers = bottom.filter(id => gross[id] === maxGrossInBottom);
  }

  let finalWinners = [];
  if (!allSquare) {
    const topGross = top.map(id => gross[id]);
    const minGrossInTop = Math.min(...topGross);
    finalWinners = top.filter(id => gross[id] === minGrossInTop);
  }

  return { matches, tally, finalLosers, finalWinners, allSquare };
}

/* ---------- small UI pieces ---------- */
function Chip({id, size=34}) {
  return (
    <span className="num inline-flex items-center justify-center rounded-lg font-extrabold text-white shrink-0"
          style={{background:TURF[id], width:size, height:size, fontSize:size*0.5}}>{id}</span>
  );
}

function Stepper({value, onChange, min=-4, max=8}) {
  const btn = "h-16 w-16 rounded-2xl flex items-center justify-center active:scale-95 transition-transform disabled:opacity-30";
  const options = [];
  for(let i=min; i<=max; i++) options.push(i);

  return (
    <div className="flex items-center gap-2">
      <button className={btn} style={{background:"var(--chip)", color:"var(--ink)"}}
              disabled={value<=min} onClick={()=>onChange(value-1)} aria-label="한 타 줄이기">
        <IconMinus size={26}/>
      </button>
      
      <div className="w-[68px] text-center relative flex flex-col items-center justify-center cursor-pointer">
        <select 
          value={value} 
          onChange={(e) => onChange(Number(e.target.value))}
          className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
        >
          {options.map(o => <option key={o} value={o}>{signed(o)} ({scoreLabel(o)})</option>)}
        </select>
        
        <div className="flex items-center justify-center gap-1">
          <div className="num font-extrabold leading-none" style={{fontSize:34, color: value>0?"var(--ink)":value<0?"var(--turf)":"var(--ink)"}}>
            {signed(value)}
          </div>
          <IconChevDown size={14} className="opacity-40 -mr-3" />
        </div>
        <div className="text-[13px] mt-1 font-semibold" style={{color:"var(--ink-soft)"}}>{scoreLabel(value)}</div>
      </div>
      
      <button className={btn} style={{background:"var(--chip)", color:"var(--ink)"}}
              disabled={value>=max} onClick={()=>onChange(value+1)} aria-label="한 타 늘리기">
        <IconPlus size={26}/>
      </button>
    </div>
  );
}

function HandicapRow({x, y, state, onChange}) {
  const opts = [
    { key:x,    label:`${x} 줌` },
    { key:null, label:"없음" },
    { key:y,    label:`${y} 줌` },
  ];
  return (
    <div className="flex items-center gap-3 py-3" style={{borderTop:"1px solid var(--line)"}}>
      <div className="flex items-center gap-1 w-[76px] shrink-0">
        <Chip id={x} size={28}/>
        <span style={{color:"var(--ink-soft)"}}><IconSwords size={14}/></span>
        <Chip id={y} size={28}/>
      </div>
      <div className="flex rounded-xl overflow-hidden grow" style={{border:"1px solid var(--line)"}}>
        {opts.map((o,i)=>{
          const on = state.giver === o.key;
          return (
            <button key={i} onClick={()=>onChange({...state, giver:o.key})}
              className="grow h-11 text-[15px] font-bold transition-colors"
              style={{
                background: on ? (o.key ? TURF[o.key] : "var(--chip)") : "transparent",
                color: on ? (o.key ? "#fff" : "var(--ink)") : "var(--ink-soft)",
                borderLeft: i ? "1px solid var(--line)" : "none",
              }}>{o.label}</button>
          );
        })}
      </div>
      <div className="flex items-center rounded-xl shrink-0" style={{border:"1px solid var(--line)", opacity: state.giver?1:0.35, pointerEvents: state.giver?"auto":"none"}}>
        <button className="h-11 w-9 flex items-center justify-center" onClick={()=>onChange({...state, strokes:Math.max(1,state.strokes-1)})} aria-label="핸디캡 줄이기">
          <IconMinus size={16}/>
        </button>
        <span className="num w-8 text-center font-extrabold text-[17px]">-{state.strokes}</span>
        <button className="h-11 w-9 flex items-center justify-center" onClick={()=>onChange({...state, strokes:Math.min(4,state.strokes+1)})} aria-label="핸디캡 늘리기">
          <IconPlus size={16}/>
        </button>
      </div>
    </div>
  );
}

function HoleStrip({log, hole, live, onPick, stripRef}) {
  return (
    <div ref={stripRef} className="flex gap-1 overflow-x-auto noscroll -mx-1 px-1"
         style={{scrollbarWidth:"none"}}>
      {Array.from({length:18},(_,i)=>i+1).map(n=>{
        const rec = log.find(r=>r.hole===n);
        const isNow = n === hole;
        const liveStr = live && live.length > 0 ? live.join(",") : undefined;
        const recStr = rec && rec.finalLosers && rec.finalLosers.length > 0 ? rec.finalLosers.join(",") : undefined;
        const loser = isNow ? liveStr : rec ? recStr : undefined;
        const played = isNow || !!rec;
        
        return (
          <button key={n} data-hole={n} onClick={()=>onPick(n)}
            className="shrink-0 rounded-lg flex flex-col items-center justify-center"
            style={{
              width:34, height:44,
              background: loser ? "var(--flag)" : played ? "var(--chip)" : "transparent",
              color: loser ? "#fff" : "var(--ink-soft)",
              border: isNow ? "2px solid var(--turf)" : "1px solid var(--line)",
              opacity: played ? 1 : .55,
            }}
            aria-label={`${n}번 홀${loser?` 패자 ${loser}`:""}`}>
            <span className="num text-[12px] leading-none" style={{opacity:.75}}>{n}</span>
            <span className="num text-[17px] font-extrabold leading-none mt-0.5" style={{letterSpacing: loser && loser.length > 1 ? "-1px" : "normal"}}>
              {loser ? loser : played ? "–" : ""}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ---------- Scorecard Template ---------- */
function ScorecardTemplate({ log, ids, names, courseName, totals, exportRef }) {
  const [dateStr, setDateStr] = useState("");
  useEffect(() => {
    const now = new Date();
    setDateStr(now.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }));
  }, [log]); 

  const nameOf = id => names[id]?.trim() || id;

  return (
    <div style={{ position: 'absolute', top: '-9999px', left: '-9999px', pointerEvents: 'none' }}>
      <div ref={exportRef} className="p-10 bg-white shadow-2xl rounded-xl" style={{ width: '960px', fontFamily: "'Gothic A1', sans-serif" }}>
        
        <div className="flex justify-between items-end border-b-[5px] pb-5 mb-8" style={{ borderColor: 'var(--turf-deep)' }}>
          <div>
            <h1 className="text-[44px] font-black tracking-tighter mb-2" style={{ color: 'var(--turf-deep)' }}>GOLF SCORECARD</h1>
            <div className="text-[20px] font-bold text-gray-500 flex items-center gap-2 tracking-tight">
              <IconMapPin size={22}/> {courseName || "기록된 골프장이 없습니다"}
            </div>
          </div>
          <div className="text-right text-[20px] font-bold text-gray-500 tracking-tight">{dateStr}</div>
        </div>
        
        <div className="flex gap-5 mb-10">
           {ids.map(id => (
             <div key={id} className="flex-1 rounded-[24px] p-6 text-center shadow-sm" style={{ backgroundColor: 'var(--chip)' }}>
                <div className="text-[28px] font-black mb-1 text-gray-800 tracking-tight">{nameOf(id)}</div>
                <div className="text-[17px] text-gray-500 mb-3 font-bold tracking-tight">단독/공동 패배</div>
                <div className="text-[46px] font-black leading-none num" style={{ color: totals[id].losses > 0 ? 'var(--flag)' : 'var(--ink)' }}>
                  {totals[id].losses}회
                </div>
             </div>
           ))}
        </div>

        <div className="rounded-[16px] overflow-hidden border-2" style={{ borderColor: 'var(--line)' }}>
          <table className="w-full text-center border-collapse text-[20px]">
            <thead>
              <tr className="text-white" style={{ backgroundColor: 'var(--turf-deep)' }}>
                <th className="py-4 border-r border-white/20 w-32 font-bold tracking-tight">HOLE</th>
                {ids.map(id => <th key={id} className="py-4 border-r border-white/20 font-bold tracking-tight">{nameOf(id)}</th>)}
                <th className="py-4 font-bold w-48 tracking-tight">이 홀의 패자</th>
              </tr>
            </thead>
            <tbody>
              {Array.from({length: 18}, (_, i) => i + 1).map(hole => {
                const rec = log.find(r => r.hole === hole);
                const hcpActive = rec ? hasHandicap(rec.hcp) : false;
                
                return (
                  <tr key={hole} className="border-b last:border-b-0" style={{ borderColor: 'var(--line)' }}>
                    <td className="py-3.5 bg-gray-50 border-r text-center align-middle" style={{ borderColor: 'var(--line)', color:'var(--ink-soft)' }}>
                      <div className="font-extrabold text-[24px] num leading-none">{hole}</div>
                      {hcpActive && (
                        <div className="inline-block mt-1.5 px-2 py-0.5 text-[14px] font-bold rounded" style={{backgroundColor:"#E0F2FE", color:"#0284C7"}}>핸디 적용</div>
                      )}
                    </td>
                    {ids.map(id => {
                      if (!rec || !rec.ids.includes(id)) {
                        return <td key={id} className="py-3.5 text-gray-300 border-r" style={{ borderColor: 'var(--line)' }}>-</td>;
                      }
                      const g = rec.gross[id];
                      const p = rec.pts[id];
                      return (
                        <td key={id} className="py-3.5 border-r" style={{ borderColor: 'var(--line)' }}>
                          <span className="font-extrabold text-[24px] text-gray-800 num tracking-tight">{signed(g)}</span>
                          <span className="text-[16px] ml-2 num font-bold" style={{ color: p>0?'var(--turf)':p<0?'var(--flag)':'#9CA3AF' }}>
                            ({signed(p)}점)
                          </span>
                        </td>
                      );
                    })}
                    <td className="py-3.5 font-black tracking-tight" style={{ color: rec?.finalLosers?.length > 0 ? 'var(--flag)' : 'var(--ink-soft)' }}>
                      {rec?.finalLosers?.length > 0 ? rec.finalLosers.map(id => nameOf(id)).join(', ') : '-'}
                    </td>
                  </tr>
                );
              })}
              <tr className="border-t-[4px] font-bold" style={{ borderColor: 'var(--turf-deep)', backgroundColor: '#f9f9f9' }}>
                <td className="py-4 border-r text-center align-middle" style={{ borderColor: 'var(--line)', color:'var(--ink)' }}>총 타수</td>
                {ids.map(id => (
                  <td key={id} className="py-4 border-r" style={{ borderColor: 'var(--line)' }}>
                    <span className="font-extrabold text-[26px] num text-gray-800 tracking-tight">{signed(totals[id].grossStrokes)}</span>
                  </td>
                ))}
                <td className="py-4 text-center text-gray-400">-</td>
              </tr>
            </tbody>
          </table>
        </div>
        
        <div className="mt-8 text-center text-[16px] text-gray-400 font-bold tracking-tight">
          Generated by WAKOI 승부 계산기
        </div>
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App(){
  useEffect(() => {
    const users = JSON.parse(localStorage.getItem('wakoi_users') || '{}');
    if (!users['ADMIN']) {
      users['ADMIN'] = { id: 'ADMIN', pw: 'dhkzhdl@1', nick: '슈퍼어드민', role: 'admin' };
      localStorage.setItem('wakoi_users', JSON.stringify(users));
    }

    if (!sessionStorage.getItem('wakoi_visited_today')) {
      sessionStorage.setItem('wakoi_visited_today', 'true');
      const stats = JSON.parse(localStorage.getItem('wakoi_stats') || '{"dailyVisits":{}, "logins":{}}');
      const today = new Date(new Date().getTime() + 9 * 60 * 60 * 1000).toISOString().slice(0, 10);
      stats.dailyVisits = stats.dailyVisits || {};
      stats.dailyVisits[today] = (stats.dailyVisits[today] || 0) + 1;
      localStorage.setItem('wakoi_stats', JSON.stringify(stats));
    }
  }, []);

  const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('wakoi_current_user')));
  const [authView, setAuthView] = useState(currentUser ? 'main' : 'login'); 
  const [authForm, setAuthForm] = useState({ id: '', pw: '', nick: '' });
  const [authError, setAuthError] = useState("");

  const [roundId, setRoundId] = useState(() => Date.now());
  const [count, setCount] = useState(4);
  const ids = useMemo(()=>IDS.slice(0,count), [count]);
  
  const [names, setNames] = useState({ A: currentUser?.nick || "", B: "", C: "", D: "" });
  const [courseName, setCourseName] = useState("");
  const [gross, setGross] = useState({A:0,B:0,C:0,D:0});
  const [hole, setHole] = useState(1);
  const [log, setLog] = useState([]);
  const [hcp, setHcp] = useState(()=>{
    const o={}; allPairs(IDS).forEach(([x,y])=>o[pairKey(x,y)]={giver:null,strokes:1}); return o;
  });

  const resetGameForNewSession = (nick = "") => {
    setLog([]);
    setHole(1);
    setGross({A:0, B:0, C:0, D:0});
    setRoundId(Date.now());
    setCourseName("");
    setCount(4);
    setNames({ A: nick, B: "", C: "", D: "" });
    const newHcp = {};
    allPairs(IDS).forEach(([x,y])=>newHcp[pairKey(x,y)]={giver:null,strokes:1});
    setHcp(newHcp);
  };

  const handleAuth = (type) => {
    setAuthError("");
    const users = JSON.parse(localStorage.getItem('wakoi_users') || '{}');
    const { id, pw, nick } = authForm;
    const cleanId = id.trim();

    if (!cleanId || !pw.trim()) return setAuthError("아이디와 비밀번호를 입력해주세요.");
    
    if (type === 'login') {
      if (Object.prototype.hasOwnProperty.call(users, cleanId) && users[cleanId].pw === pw) {
        setCurrentUser(users[cleanId]);
        localStorage.setItem('wakoi_current_user', JSON.stringify(users[cleanId]));
        setAuthView('main');
        setAuthForm({ id: '', pw: '', nick: '' });
        
        resetGameForNewSession(users[cleanId].nick);

        const stats = JSON.parse(localStorage.getItem('wakoi_stats') || '{"dailyVisits":{}, "logins":{}}');
        stats.logins = stats.logins || {};
        stats.logins[cleanId] = (stats.logins[cleanId] || 0) + 1;
        localStorage.setItem('wakoi_stats', JSON.stringify(stats));
      } else {
        setAuthError("아이디 또는 비밀번호가 일치하지 않습니다.");
      }
    } else { 
      if (!/^\d{4}$/.test(pw)) return setAuthError("비밀번호는 숫자 4자리로 설정해주세요.");
      if (Object.prototype.hasOwnProperty.call(users, cleanId)) {
        return setAuthError("이미 존재하는 아이디입니다.");
      }
      
      const newUser = { id: cleanId, pw, nick: nick.trim() || `${cleanId} 님`, role: 'user' };
      users[cleanId] = newUser;
      localStorage.setItem('wakoi_users', JSON.stringify(users));
      setCurrentUser(newUser);
      localStorage.setItem('wakoi_current_user', JSON.stringify(newUser));
      setAuthView('main');
      setAuthForm({ id: '', pw: '', nick: '' });

      resetGameForNewSession(newUser.nick);

      const stats = JSON.parse(localStorage.getItem('wakoi_stats') || '{"dailyVisits":{}, "logins":{}}');
      stats.logins = stats.logins || {};
      stats.logins[cleanId] = 1;
      localStorage.setItem('wakoi_stats', JSON.stringify(stats));
    }
  };

  const logout = () => {
    setCurrentUser(null);
    localStorage.removeItem('wakoi_current_user');
    setAuthView('login');
    resetGameForNewSession(""); 
  };

  const [openHcp, setOpenHcp] = useState(true);
  const [openDetail, setOpenDetail] = useState(false);
  const [openLog, setOpenLog] = useState(false);
  const stripRef = useRef(null);
  const exportRef = useRef(null);

  const nameOf = id => names[id]?.trim() || id;
  const result = useMemo(()=>judgeHole(ids, gross, hcp), [ids, gross, hcp]);
  const activeHcpCount = allPairs(ids).filter(([x,y])=>hcp[pairKey(x,y)].giver).length;

  const setGrossFor = (id,v) => setGross(s=>({...s,[id]:v}));
  const setHcpFor = (x,y,v) => setHcp(s=>({...s,[pairKey(x,y)]:v}));

  const saveHole = () => {
    if (hole > 18) return;
    setLog(l => [...l.filter(r=>r.hole!==hole), {
      hole, ids:[...ids], gross:{...gross},
      pts: Object.fromEntries(ids.map(id=>[id, result.tally[id].pts])),
      record: Object.fromEntries(ids.map(id=>[id, {...result.tally[id]}])),
      hcp: Object.fromEntries(allPairs(ids).map(([x,y])=>[pairKey(x,y), {...hcp[pairKey(x,y)]}])),
      finalLosers: result.finalLosers, finalWinners: result.finalWinners,
    }].sort((a,b)=>a.hole-b.hole));
    setHole(h=>Math.min(19, h+1));
    setGross({A:0,B:0,C:0,D:0});
    window.scrollTo({top:0, behavior:"smooth"});
  };
  
  const jumpToHole = n => {
    const rec = log.find(r=>r.hole===n);
    setHole(n);
    setGross(rec ? {A:0,B:0,C:0,D:0, ...rec.gross} : {A:0,B:0,C:0,D:0});
    if (rec) { setCount(rec.ids.length); setHcp(s=>({...s, ...rec.hcp})); }
    window.scrollTo({top:0, behavior:"smooth"});
  };
  
  const undo = () => {
    if(!log.length) return;
    const last = log[log.length-1];
    setLog(l=>l.slice(0,-1));
    setHole(last.hole);
    setGross({A:0,B:0,C:0,D:0, ...last.gross});
  };
  
  const resetAll = () => { 
    setLog([]); setHole(1); setGross({A:0,B:0,C:0,D:0}); 
    setRoundId(Date.now()); 
  };

  const totals = useMemo(()=>{
    const t = Object.fromEntries(IDS.map(id=>[id,{pts:0,losses:0, grossStrokes:0}]));
    log.forEach(r => { 
      Object.entries(r.pts).forEach(([id,p])=>t[id].pts+=p); 
      if(r.finalLosers) {
        r.finalLosers.forEach(id => t[id].losses++);
      }
      Object.entries(r.gross).forEach(([id,g])=>t[id].grossStrokes+=g);
    });
    return t;
  }, [log]);

  useEffect(() => {
    if (hole === 19 && currentUser) {
      const storageKey = `wakoi_hist_${currentUser.id}`;
      const hList = JSON.parse(localStorage.getItem(storageKey) || '[]');
      const newRecord = {
        roundId,
        date: new Date().getTime(),
        courseName,
        ids, names, log, totals
      };
      const existingIdx = hList.findIndex(h => h.roundId === roundId);
      if (existingIdx >= 0) hList[existingIdx] = newRecord;
      else hList.unshift(newRecord);
      localStorage.setItem(storageKey, JSON.stringify(hList));
    }
  }, [hole, currentUser, roundId, courseName, ids, names, log, totals]);

  const [historyList, setHistoryList] = useState([]);
  const [historyExpandedId, setHistoryExpandedId] = useState(null);
  const [historyDeleteTarget, setHistoryDeleteTarget] = useState(null);

  useEffect(() => {
    if (authView === 'history' && currentUser) {
      setHistoryList(JSON.parse(localStorage.getItem(`wakoi_hist_${currentUser.id}`) || '[]'));
      setHistoryExpandedId(null);
      setHistoryDeleteTarget(null);
    }
  }, [authView, currentUser]);

  const removeHistory = (targetRoundId) => {
    const next = historyList.filter(h => h.roundId !== targetRoundId);
    setHistoryList(next);
    if (currentUser) localStorage.setItem(`wakoi_hist_${currentUser.id}`, JSON.stringify(next));
    setHistoryDeleteTarget(null);
    if (historyExpandedId === targetRoundId) setHistoryExpandedId(null);
  };

  useEffect(()=>{
    if (authView !== 'main') return;
    const el = stripRef.current?.querySelector(`[data-hole="${hole}"]`);
    if (el) el.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  }, [hole, authView]);

  const handleExport = async (mode) => {
    if (!exportRef.current) return;
    try {
      const canvas = await window.html2canvas(exportRef.current, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
      const fileName = `WAKOI_스코어카드_${dateStr}.jpg`;

      if (mode === 'download') {
        const link = document.createElement('a');
        link.download = fileName; link.href = dataUrl; link.click();
      } else if (mode === 'share') {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], fileName, { type: 'image/jpeg' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'WAKOI 스코어카드',
                text: `${courseName ? courseName : '골프장'} 라운딩 결과입니다.`,
                files: [file]
              });
            } catch(err) { console.log('Share canceled or failed', err); }
          } else {
            alert("현재 브라우저/기기에서는 직접 공유를 지원하지 않아 이미지 다운로드로 대체합니다.");
            const link = document.createElement('a'); link.download = fileName; link.href = dataUrl; link.click();
          }
        }, 'image/jpeg', 0.9);
      }
    } catch (error) {
      console.error(error); alert("이미지 생성 중 오류가 발생했습니다.");
    }
  };
  
  if (authView === 'login' || authView === 'signup') {
    return (
      <div className="min-h-screen flex items-center justify-center px-4" style={{background:"var(--paper)"}}>
        <div className="w-full max-w-sm p-6 rounded-3xl" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <div className="text-center mb-6">
            <IconFlag size={42} className="mx-auto mb-2" style={{color:"var(--turf-deep)"}}/>
            <h1 className="text-[25px] font-black tracking-tight" style={{color:"var(--ink)"}}>GOLF 승부 계산기</h1>
            <p className="text-[14px] font-bold mt-1 tracking-tight" style={{color:"var(--ink-soft)"}}>라운딩 독박 점수를 완벽하게 계산하세요</p>
          </div>
          
          <div className="flex mb-5 p-1 rounded-xl" style={{background:"var(--chip)"}}>
            <button onClick={()=>{setAuthView('login'); setAuthError('');}} className={`flex-1 py-2.5 text-[16px] font-bold tracking-tight rounded-lg transition-colors ${authView==='login'?'bg-white shadow-sm':'text-gray-500'}`}>로그인</button>
            <button onClick={()=>{setAuthView('signup'); setAuthError('');}} className={`flex-1 py-2.5 text-[16px] font-bold tracking-tight rounded-lg transition-colors ${authView==='signup'?'bg-white shadow-sm':'text-gray-500'}`}>회원가입</button>
          </div>

          <div className="space-y-3">
            <input 
              value={authForm.id} 
              onChange={e=>setAuthForm({...authForm, id:e.target.value})} 
              placeholder="아이디" 
              className="w-full px-4 py-3.5 rounded-xl outline-none font-bold tracking-tight text-[17px]" 
              style={{background:"var(--paper)", color:"var(--ink)"}}
            />
            <input 
              type="password" 
              value={authForm.pw} 
              onChange={e=>setAuthForm({...authForm, pw:e.target.value})} 
              placeholder={authView === 'signup' ? "비밀번호 (숫자 4자리)" : "비밀번호"} 
              className="w-full px-4 py-3.5 rounded-xl outline-none font-bold num tracking-tight text-[17px]" 
              style={{background:"var(--paper)", color:"var(--ink)"}}
            />
            
            {authView === 'signup' && (
              <input value={authForm.nick} onChange={e=>setAuthForm({...authForm, nick:e.target.value})} placeholder="스코어카드에 표시될 별명 (선택)" className="w-full px-4 py-3.5 rounded-xl outline-none font-bold tracking-tight text-[17px]" style={{background:"var(--paper)", color:"var(--ink)"}}/>
            )}
            
            {authError && <div className="text-[14px] font-bold px-1 tracking-tight" style={{color:"var(--flag)"}}>{authError}</div>}
            
            <button onClick={()=>handleAuth(authView)} className="w-full py-4 mt-2 rounded-xl font-black tracking-tight text-[17px] text-white active:scale-[.98] transition-transform" style={{background:"var(--turf-deep)"}}>
              {authView === 'login' ? '로그인' : '간편 회원가입'}
            </button>
            
            <button onClick={()=>{
              setAuthView('main'); 
              setAuthError('');
              resetGameForNewSession(""); 
            }} className="w-full py-3 mt-1 rounded-xl font-bold tracking-tight text-[15px] active:scale-[.98] transition-transform" style={{background:"var(--chip)", color:"var(--ink-soft)"}}>
              비회원으로 바로 시작하기
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (authView === 'admin') {
    const allUsers = JSON.parse(localStorage.getItem('wakoi_users') || '{}');
    const allStats = JSON.parse(localStorage.getItem('wakoi_stats') || '{"dailyVisits":{}, "logins":{}}');
    const dailyArr = Object.entries(allStats.dailyVisits || {}).sort((a,b) => b[0].localeCompare(a[0]));
    const userArr = Object.values(allUsers).filter(u => u.id !== 'ADMIN'); 

    return (
      <div className="min-h-screen pb-12" style={{background:"var(--paper)"}}>
        <header className="sticky top-0 z-20" style={{background:"var(--turf-deep)", color:"#F3F7F1"}}>
          <div className="max-w-md mx-auto px-4 h-16 flex items-center gap-3">
            <button onClick={()=>setAuthView('main')} className="p-2 -ml-2 rounded-full active:bg-white/10 transition-colors">
              <IconBack size={24}/>
            </button>
            <div className="font-black text-[20px] tracking-tight grow text-center pr-8">슈퍼 관리자 통계</div>
          </div>
        </header>

        <main className="max-w-md mx-auto px-4 py-6 space-y-5">
          <div className="p-5 rounded-2xl" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
            <h2 className="font-black text-[18px] tracking-tight mb-3 flex items-center gap-2"><IconMapPin size={18}/> 일별 조회수(접속 통계)</h2>
            <div className="space-y-2">
              {dailyArr.length > 0 ? dailyArr.map(([date, count]) => (
                <div key={date} className="flex justify-between font-bold text-[16px] tracking-tight p-2 rounded-lg" style={{background:"var(--chip)"}}>
                  <span style={{color:"var(--ink-soft)"}}>{date}</span>
                  <span className="num" style={{color:"var(--turf-deep)"}}>{count}회</span>
                </div>
              )) : <div className="text-[14px] text-gray-400 font-medium">기록이 없습니다.</div>}
            </div>
          </div>

          <div className="p-5 rounded-2xl" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
            <h2 className="font-black text-[18px] tracking-tight mb-3 flex items-center gap-2"><IconUsers size={18}/> 가입 회원 현황 (총 {userArr.length}명)</h2>
            <div className="space-y-2">
              <div className="flex text-[13px] font-bold tracking-tight pb-2" style={{color:"var(--ink-soft)", borderBottom:"1px solid var(--line)"}}>
                <span className="w-1/3">아이디</span>
                <span className="w-1/3 text-center">설정된 별명</span>
                <span className="w-1/3 text-right">총 로그인 횟수</span>
              </div>
              {userArr.length > 0 ? userArr.map(u => (
                <div key={u.id} className="flex items-center text-[15px] font-bold tracking-tight p-2 rounded-lg" style={{background:"var(--chip)"}}>
                  <span className="w-1/3 truncate" style={{color:"var(--ink)"}}>{u.id}</span>
                  <span className="w-1/3 text-center truncate" style={{color:"var(--ink-soft)"}}>{u.nick}</span>
                  <span className="w-1/3 text-right num" style={{color:"var(--turf-deep)"}}>{allStats.logins?.[u.id] || 0}회</span>
                </div>
              )) : <div className="text-[14px] text-gray-400 font-medium">가입된 회원이 없습니다.</div>}
            </div>
          </div>
        </main>
      </div>
    );
  }

  if (authView === 'history') {
    const deleteTargetHistory = historyList.find(h => h.roundId === historyDeleteTarget);
    return (
      <div className="min-h-screen pb-12" style={{background:"var(--paper)"}}>
        <header className="sticky top-0 z-20" style={{background:"var(--turf-deep)", color:"#F3F7F1"}}>
          <div className="max-w-md mx-auto px-4 h-16 flex items-center gap-3">
            <button onClick={()=>setAuthView('main')} className="p-2 -ml-2 rounded-full active:bg-white/10 transition-colors">
              <IconBack size={24}/>
            </button>
            <div className="font-black text-[22px] tracking-tight grow text-center pr-8 truncate">내 라운딩 기록 ({historyList.length})</div>
          </div>
        </header>

        <main className="max-w-md mx-auto px-4 py-6 space-y-3">
          {historyList.length === 0 ? (
            <div className="text-center py-20 font-bold text-[17px] tracking-tight" style={{color:"var(--ink-soft)"}}>저장된 기록이 없습니다.</div>
          ) : (
            historyList.map((h) => {
              const isOpen = historyExpandedId === h.roundId;
              return (
                <div key={h.roundId} className="rounded-2xl overflow-hidden transition-colors"
                     style={{background:"var(--card)", border: isOpen ? "1.5px solid var(--turf)" : "1px solid var(--line)"}}>

                  <button onClick={()=>setHistoryExpandedId(isOpen ? null : h.roundId)}
                    className="w-full flex items-center gap-3 p-4 text-left">
                    <div className="w-12 h-12 rounded-xl flex items-center justify-center shrink-0"
                         style={{background:"var(--chip)", color:"var(--turf-deep)"}}>
                      <IconFlag size={22}/>
                    </div>
                    <div className="grow min-w-0">
                      <div className="font-extrabold text-[20px] tracking-tight truncate">{h.courseName || '골프장 미지정'}</div>
                      <div className="text-[15px] font-semibold mt-0.5 tracking-tight" style={{color:"var(--ink-soft)"}}>
                        {new Date(h.date).toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'})} · {h.ids.length}인 · {h.log.length}홀
                      </div>
                    </div>
                    <span className="w-9 h-9 flex items-center justify-center shrink-0 transition-transform"
                          style={{color:"var(--ink-soft)", transform: isOpen ? "rotate(180deg)" : "none"}}>
                      <IconChev size={22}/>
                    </span>
                  </button>

                  {isOpen && (
                    <div className="px-4 pb-4" style={{borderTop:"1px solid var(--line)"}}>
                      <div className="flex gap-2 pt-4">
                        {h.ids.map(id => {
                          const grossSum = h.totals[id].grossStrokes ?? h.log.reduce((acc, cur) => acc + (cur.gross[id] || 0), 0);
                          return (
                            <div key={id} className="flex-1 rounded-xl py-3 px-1 text-center" style={{background:"var(--chip)"}}>
                              <div className="font-bold text-[16px] tracking-tight truncate px-1">{h.names[id] || id}</div>
                              <div className="num text-[23px] font-black mt-1 leading-none"
                                   style={{color: h.totals[id].pts>0?"var(--turf)":h.totals[id].pts<0?"var(--flag)":"var(--ink)"}}>
                                {signed(h.totals[id].pts)}점
                              </div>
                              <div className="text-[14px] mt-1 font-semibold tracking-tight" style={{color:"var(--ink-soft)"}}>패배 {h.totals[id].losses}</div>
                              <div className="text-[14px] mt-1 font-bold tracking-tight num" style={{color:"var(--ink)"}}>합 {signed(grossSum)}타</div>
                            </div>
                          );
                        })}
                      </div>

                      <div className="text-[15px] font-bold mt-5 mb-2 tracking-tight" style={{color:"var(--ink-soft)"}}>홀별 스코어</div>
                      <div className="overflow-x-auto noscroll rounded-xl" style={{border:"1px solid var(--line)"}}>
                        <table className="w-full text-center" style={{minWidth: 120 + h.ids.length*72}}>
                          <thead>
                            <tr className="text-[15px] font-bold tracking-tight" style={{background:"var(--chip)", color:"var(--ink-soft)"}}>
                              <th className="py-2.5 w-12">홀</th>
                              {h.ids.map(id => <th key={id} className="py-2.5">{h.names[id] || id}</th>)}
                              <th className="py-2.5 w-20">패자</th>
                            </tr>
                          </thead>
                          <tbody>
                            {h.log.map(rec => {
                              const hcpActive = hasHandicap(rec.hcp);
                              return (
                                <tr key={rec.hole} style={{borderTop:"1px solid var(--line)"}}>
                                  <td className="py-2.5 text-center">
                                    <div className="num font-bold text-[16px] leading-none">{rec.hole}</div>
                                    {hcpActive && (
                                      <div className="inline-block mt-1 px-1.5 text-[10px] font-bold rounded" style={{backgroundColor:"#E0F2FE", color:"#0284C7"}}>핸디</div>
                                    )}
                                  </td>
                                  {h.ids.map(id => {
                                    const inRound = rec.ids.includes(id);

                                    return (
                                      <td key={id} className="py-2.5">
                                        <span className="num font-bold text-[17px]"
                                              style={{color: !inRound ? "var(--ink-soft)" : isRecLoser ? "var(--flag)" : "var(--ink)", opacity: inRound?1:.4}}>
                                          {inRound ? signed(rec.gross[id]) : "·"}

                                      </td>
                                    );

                                  <td className="py-2.5 text-[13px] font-bold tracking-tight" style={{ color: rec.finalLosers?.length > 0 ? 'var(--flag)' : 'var(--ink-soft)' }}>
                                    {rec.finalLosers?.length > 0 ? rec.finalLosers.map(id => h.names[id] || id).join(', ') : '-'}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                      <button onClick={()=>setHistoryDeleteTarget(h.roundId)}
                        className="w-full flex items-center justify-center gap-2 h-12 mt-4 rounded-xl font-bold tracking-tight text-[16px] active:scale-[.98] transition-transform"
                        style={{background:"color-mix(in srgb, var(--flag) 10%, transparent)", color:"var(--flag)"}}>
                        <IconTrash size={17}/> 이 기록 삭제
                      </button>
                    </div>
                  )}
                </div>
              );
            })
          )}
        </main>

        {deleteTargetHistory && (
          <div className="fixed inset-0 z-50 flex items-center justify-center px-6" style={{background:"rgba(10,16,12,0.55)"}}>
            <div className="w-full max-w-xs rounded-3xl p-6 text-center" style={{background:"var(--card)"}}>
              <div className="w-14 h-14 mx-auto rounded-full flex items-center justify-center mb-4"
                   style={{background:"color-mix(in srgb, var(--flag) 14%, transparent)", color:"var(--flag)"}}>
                <IconAlert size={28}/>
              </div>
              <div className="font-black tracking-tight text-[21px] mb-1.5">정말 삭제하시겠습니까?</div>
              <div className="text-[16px] font-medium tracking-tight mb-6" style={{color:"var(--ink-soft)"}}>
                {deleteTargetHistory.courseName || '골프장 미지정'} · {new Date(deleteTargetHistory.date).toLocaleDateString('ko-KR')} 기록이 영구 삭제됩니다.
              </div>
              <div className="flex gap-2.5">
                <button onClick={()=>setHistoryDeleteTarget(null)}
                  className="flex-1 h-[52px] rounded-xl font-bold tracking-tight text-[17px] active:scale-[.98] transition-transform"
                  style={{background:"var(--chip)", color:"var(--ink)"}}>
                  아니요
                </button>
                <button onClick={()=>removeHistory(historyDeleteTarget)}
                  className="flex-1 h-[52px] rounded-xl font-bold tracking-tight text-[17px] text-white active:scale-[.98] transition-transform"
                  style={{background:"var(--flag)"}}>
                  네, 삭제
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  const verdictColor = result.finalLosers.length > 0 ? "var(--flag)" : "var(--turf-deep)";

  return (
    <div className="min-h-screen pb-[248px]">
      
      <ScorecardTemplate log={log} ids={ids} names={names} courseName={courseName} totals={totals} exportRef={exportRef} />

      <header className="sticky top-0 z-20" style={{background:"var(--turf-deep)", color:"#F3F7F1"}}>
        <div className="max-w-md mx-auto px-4 h-16 flex items-center gap-3">
          <IconFlag size={22} className="shrink-0" />
          <div className="grow min-w-0">
            <div className="font-black tracking-tight text-[20px] leading-tight truncate">홀 승부 계산기 - WAKOI</div>
            <div className="text-[13px] font-medium tracking-tight truncate" style={{color:"#9EC4AC"}}>
              {currentUser ? `${currentUser.nick} 님` : '비회원'} · 1:1 핸디캡 · {ids.length}인
            </div>
          </div>

          {currentUser && currentUser.role === 'admin' && (
            <button onClick={()=>setAuthView('admin')} className="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-white/20 active:bg-white/30 transition-colors mr-1">
              <IconShield size={18} />
            </button>
          )}

          {currentUser && (
            <button onClick={()=>setAuthView('history')} className="w-10 h-10 shrink-0 flex items-center justify-center rounded-full active:bg-white/10 transition-colors">
              <IconHistory size={20}/>
            </button>
          )}

          <div className="num shrink-0 text-right leading-none pl-2 border-l border-white/20">
            <div className="text-[12px] font-bold tracking-tight" style={{color:"#9EC4AC"}}>HOLE</div>
            <div className="text-[29px] font-extrabold tracking-tight">{hole > 18 ? "END" : hole}</div>
          </div>
        </div>
      </header>

      <main className="max-w-md mx-auto px-4">
        <div className="flex items-center gap-2 py-4 mt-1" style={{borderBottom:"1px solid var(--line)"}}>
          <span className="flex items-center gap-1.5 text-[15px] font-bold tracking-tight shrink-0 whitespace-nowrap" style={{color:"var(--ink-soft)"}}>
            <IconMapPin size={16}/> 골프장
          </span>
          <input 
            value={courseName} 
            onChange={e=>setCourseName(e.target.value)} 
            placeholder="예: 킹스데일 GC"
            className="grow min-w-0 bg-transparent font-bold tracking-tight text-[17px] outline-none text-right px-2"
            style={{color:"var(--ink)"}} 
          />
          {currentUser ? (
            <button onClick={logout} className="whitespace-nowrap text-[13px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg shrink-0 transition-colors" style={{background:"var(--chip)", color:"var(--ink-soft)"}}>
              로그아웃
            </button>
          ) : (
            <button onClick={()=>setAuthView('login')} className="whitespace-nowrap text-[13px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg shrink-0 transition-colors" style={{background:"var(--turf)", color:"#fff"}}>
              로그인
            </button>
          )}
        </div>

        <div className="flex items-center gap-3 py-4">
          <span className="flex items-center gap-1.5 text-[15px] font-bold tracking-tight shrink-0 whitespace-nowrap" style={{color:"var(--ink-soft)"}}>
            <IconUsers size={16}/> 참가 인원
          </span>
          <div className="flex rounded-xl overflow-hidden ml-auto shrink-0" style={{border:"1px solid var(--line)"}}>
            {[3,4].map((n,i)=>(
              <button key={n} onClick={()=>setCount(n)}
                className="h-10 px-5 text-[16px] font-bold tracking-tight"
                style={{background: count===n?"var(--turf)":"transparent", color: count===n?"#fff":"var(--ink-soft)", borderLeft:i?"1px solid var(--line)":"none"}}>
                {n}명
              </button>
            ))}
          </div>
        </div>

        <section className="rounded-2xl overflow-hidden shadow-sm" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          {ids.map((id,i)=>{
            const isLoser = result.finalLosers.includes(id);
            const isWinner = result.finalWinners.includes(id);
            return (
              <div key={id} className="flex items-center gap-3 px-3 py-3"
                   style={{borderTop: i?"1px solid var(--line)":"none",
                           borderLeft:`6px solid ${isLoser?"var(--flag)":isWinner?"var(--sand)":TURF[id]}`,
                           background: isLoser?"color-mix(in srgb, var(--flag) 8%, var(--card))":"var(--card)"}}>
                <Chip id={id}/>
                <div className="grow min-w-0">
                  <input value={names[id]} placeholder={`플레이어 ${id}`} maxLength={6}
                    onChange={e=>setNames(s=>({...s,[id]:e.target.value}))}
                    className="w-full bg-transparent font-bold tracking-tight text-[18px] outline-none"
                    style={{color:"var(--ink)"}} />
                  <div className="text-[13px] font-semibold mt-0.5 num" style={{color:"var(--ink-soft)"}}>
                    {result.tally[id].win}승 {result.tally[id].lose}패 {result.tally[id].tie}무
                  </div>
                </div>
                <Stepper value={gross[id]} onChange={v=>setGrossFor(id,v)} />
              </div>
            );
          })}
        </section>

        <section className="rounded-2xl mt-4 px-4 shadow-sm" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <button onClick={()=>setOpenHcp(v=>!v)} className="w-full flex items-center gap-2 py-4 text-left">
            <span className="font-bold text-[17px] tracking-tight">핸디캡</span>
            <span className="num text-[14px] px-2.5 py-0.5 rounded-full font-bold shrink-0"
                  style={{background:"var(--chip)", color:"var(--ink-soft)"}}>{activeHcpCount}쌍 적용</span>
            <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openHcp?"rotate(180deg)":"none"}}>
              <IconChev size={20}/>
            </span>
          </button>
          {openHcp && (
            <div className="pb-3">
              <p className="text-[14px] font-medium tracking-tight leading-snug pb-2" style={{color:"var(--ink-soft)"}}>
                주는 사람을 고르면 받는 사람의 타수에서 그만큼 빼고 비교합니다. 홀마다 바꿔도 됩니다.
              </p>
              {allPairs(ids).map(([x,y])=>(
                <HandicapRow key={pairKey(x,y)} x={x} y={y}
                  state={hcp[pairKey(x,y)]} onChange={v=>setHcpFor(x,y,v)} />
              ))}
            </div>
          )}
        </section>

        <section className="rounded-2xl mt-4 px-4 shadow-sm" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <button onClick={()=>setOpenDetail(v=>!v)} className="w-full flex items-center gap-2 py-4 text-left">
            <span className="font-bold text-[17px] tracking-tight">매치업 {result.matches.length}개 보기</span>
            <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openDetail?"rotate(180deg)":"none"}}>
              <IconChev size={20}/>
            </span>
          </button>
          {openDetail && (
            <div className="pb-3">
              {result.matches.map(m=>(
                <div key={pairKey(m.x,m.y)} className="flex items-center gap-2 py-3" style={{borderTop:"1px solid var(--line)"}}>
                  <div className="flex items-center gap-1.5 grow">
                    <Chip id={m.x} size={26}/>
                    <span className="num font-extrabold text-[17px]" style={{color: m.winner===m.x?"var(--turf)":"var(--ink-soft)"}}>{signed(m.netX)}</span>
                    <span className="text-[14px] px-1 font-bold tracking-tight" style={{color:"var(--ink-soft)"}}>vs</span>
                    <span className="num font-extrabold text-[17px]" style={{color: m.winner===m.y?"var(--turf)":"var(--ink-soft)"}}>{signed(m.netY)}</span>
                    <Chip id={m.y} size={26}/>
                    {m.giver && (
                      <span className="text-[13px] ml-1 font-semibold tracking-tight" style={{color:"var(--ink-soft)"}}>
                        {m.giver}→{m.giver===m.x?m.y:m.x} -{m.strokes}
                      </span>
                    )}
                  </div>
                  <span className="text-[14px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg shrink-0"
                        style={{background: m.winner?"color-mix(in srgb, var(--turf) 14%, transparent)":"var(--chip)",
                                color: m.winner?"var(--turf)":"var(--ink-soft)"}}>
                    {m.winner ? `${nameOf(m.winner)} 승` : "무승부"}
                  </span>
                </div>
              ))}
            </div>
          )}
        </section>

        <section className="rounded-2xl mt-4 p-4 shadow-sm" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <div className="flex items-center gap-2 mb-1">
            <span className="font-bold text-[17px] tracking-tight">현재 {log.length}홀 누적</span>
            <button onClick={undo} disabled={!log.length}
              className="ml-auto flex items-center gap-1 text-[14px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg disabled:opacity-30 shrink-0"
              style={{background:"var(--chip)", color:"var(--ink)"}}><IconUndo size={14}/> 되돌리기</button>
            <button onClick={resetAll}
              className="flex items-center gap-1 text-[14px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg shrink-0"
              style={{background:"var(--chip)", color:"var(--ink)"}}><IconRotate size={14}/> 초기화</button>
          </div>
          
          {log.length === 0 ? (
            <p className="text-[15px] font-medium tracking-tight py-2" style={{color:"var(--ink-soft)"}}>홀을 저장하면 기록이 실시간으로 쌓입니다.</p>
          ) : (
            <>
              <div className="flex gap-2 pt-2">
                {ids.map(id=>(
                  <div key={id} className="grow rounded-xl p-2.5 text-center min-w-0" style={{background:"var(--chip)"}}>
                    <Chip id={id} size={24}/>
                    <div className="num text-[23px] font-extrabold mt-1.5 leading-none"
                         style={{color: totals[id].pts>0?"var(--turf)":totals[id].pts<0?"var(--flag)":"var(--ink)"}}>
                      {signed(totals[id].pts)}점
                    </div>
                    <div className="text-[13px] font-semibold tracking-tight mt-1" style={{color:"var(--ink-soft)"}}>패배 {totals[id].losses}</div>
                    <div className="text-[14px] font-bold tracking-tight mt-1 num truncate" style={{color:"var(--ink)"}}>
                      누적 {signed(totals[id].grossStrokes)}타
                    </div>
                  </div>
                ))}
              </div>

              <button onClick={()=>setOpenLog(v=>!v)} className="w-full flex items-center gap-2 pt-5 pb-1 text-left">
                <span className="font-bold text-[16px] tracking-tight">홀별 상세 기록</span>
                <span className="text-[14px] font-medium tracking-tight" style={{color:"var(--ink-soft)"}}>타수 · 점수 · 패자</span>
                <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openLog?"rotate(180deg)":"none"}}>
                  <IconChev size={18}/>
                </span>
              </button>

              {openLog && (
                <div className="pt-1">
                  <div className="flex items-center gap-2 pb-2 text-[13px] font-bold tracking-tight" style={{color:"var(--ink-soft)"}}>
                    <span className="num w-8 text-center shrink-0">홀</span>
                    {ids.map(id=><span key={id} className="grow text-center">{nameOf(id)}</span>)}
                    <span className="w-[54px] text-right shrink-0">패자</span>
                  </div>
                  {log.map(rec=>(
                    <button key={rec.hole} onClick={()=>jumpToHole(rec.hole)}
                      className="w-full flex items-center gap-2 py-2.5 text-left active:opacity-70"
                      style={{borderTop:"1px solid var(--line)"}}>
                      <div className="w-8 flex flex-col items-center justify-center shrink-0">
                        <span className="num font-extrabold text-[17px] leading-none">{rec.hole}</span>
                        {hasHandicap(rec.hcp) && (
                          <span className="text-[10px] font-bold mt-1 px-1 rounded" style={{backgroundColor:"#E0F2FE", color:"#0284C7"}}>핸디</span>
                        )}
                      </div>
                      {ids.map(id=>{
                        const g = rec.gross?.[id], p = rec.pts?.[id];
                        const inRound = rec.ids.includes(id);
                        return (
                          <span key={id} className="grow text-center">
                            <span className="num font-bold text-[17px] block leading-none"
                                  style={{color: inRound ? "var(--ink)" : "var(--ink-soft)", opacity: inRound?1:.4}}>
                              {inRound ? signed(g) : "·"}
                            </span>
                            {inRound && (
                              <span className="num text-[12px] font-bold mt-0.5 block"
                                    style={{color: p>0?"var(--turf)":p<0?"var(--flag)":"var(--ink-soft)"}}>
                                {signed(p)}
                              </span>
                            )}
                          </span>
                        );
                      })}
                      <span className="w-[54px] flex justify-end shrink-0">
                        {rec.finalLosers && rec.finalLosers.length > 0 ? (
                          <span className="num text-[14px] font-extrabold px-2 py-1 rounded-lg text-white"
                                style={{background:"var(--flag)"}}>{rec.finalLosers.join(",")}</span>
                        ) : (
                          <span className="text-[14px] font-bold tracking-tight px-2 py-1 rounded-lg"
                                style={{background:"var(--chip)", color:"var(--ink-soft)"}}>없음</span>
                        )}
                      </span>
                    </button>
                  ))}
                  
                  <div className="flex items-center gap-2 py-3 mt-1 text-center font-bold" style={{borderTop:"2px solid var(--line)", background:"var(--chip)", borderRadius:"0 0 12px 12px"}}>
                    <span className="w-8 shrink-0 text-[13px]" style={{color:"var(--ink-soft)"}}>합계</span>
                    {ids.map(id => (
                      <span key={id} className="grow num text-[17px]" style={{color: totals[id].grossStrokes !== 0 ? "var(--ink)" : "var(--ink-soft)"}}>
                        {signed(totals[id].grossStrokes)}
                      </span>
                    ))}
                    <span className="w-[54px] shrink-0"></span>
                  </div>

                  <p className="text-[13px] font-medium tracking-tight pt-2.5" style={{color:"var(--ink-soft)"}}>
                    줄을 누르면 그 홀로 돌아가 타수와 핸디캡을 고칠 수 있습니다. 다시 저장하면 덮어씁니다.
                  </p>
                </div>
              )}

              <div className="flex gap-2 pt-4 mt-4" style={{borderTop:"1px solid var(--line)"}}>
                <button onClick={()=>handleExport('download')} className="grow h-12 flex items-center justify-center gap-1.5 rounded-xl text-[16px] font-extrabold tracking-tight text-white active:scale-95 transition-transform shrink-0 min-w-0" style={{backgroundColor: "var(--turf-deep)"}}>
                  <IconDownload size={18}/> 스코어카드 저장
                </button>
                <button onClick={()=>handleExport('share')} className="grow h-12 flex items-center justify-center gap-1.5 rounded-xl text-[16px] font-extrabold tracking-tight text-white active:scale-95 transition-transform shrink-0 min-w-0" style={{backgroundColor: "#3B82F6"}}>
                  <IconShare size={18}/> 결과 공유
                </button>
              </div>

            </>
          )}
        </section>

      </main>

      <div className="fixed bottom-0 left-0 right-0 z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.03)]" style={{background:"var(--paper)", borderTop:"1px solid var(--line)"}}>
        <div className="max-w-md mx-auto px-4 pt-3" style={{paddingBottom:"calc(16px + env(safe-area-inset-bottom))"}}>
          <HoleStrip log={log} hole={hole} live={result.finalLosers} onPick={jumpToHole} stripRef={stripRef} />
          <div className="h-3" />
          <div key={`${result.finalLosers.join('-')}-${result.finalWinners.join('-')}`} className="verdict-in rounded-2xl px-4 py-3 flex items-center gap-3 shadow-md"
               style={{background:verdictColor, color:"#fff"}}>
            <span style={{opacity:.9}} className="shrink-0">{result.finalLosers.length > 0 ? <IconFlag size={24}/> : <IconTrophy size={24}/>}</span>
            <div className="grow min-w-0">
              {result.finalLosers.length > 0 ? (
                <>
                  <div className="text-[13px] font-bold tracking-tight" style={{opacity:.85}}>
                    {result.finalLosers.length > 1 ? "이 홀의 공동 패자" : "이 홀의 단독 패자"}
                  </div>
                  <div className="font-black tracking-tight text-[23px] leading-tight truncate">
                    {result.finalLosers.map(id => nameOf(id)).join(", ")}
                  </div>
                </>
              ) : (
                <>
                  <div className="text-[13px] font-bold tracking-tight" style={{opacity:.85}}>패자 없음</div>
                  <div className="font-black tracking-tight text-[21px] leading-tight truncate">
                    {result.allSquare ? "올스퀘어" : "패자를 가릴 수 없음"}
                  </div>
                </>
              )}
            </div>
            {result.finalWinners.length > 0 && (
              <span className="flex items-center gap-1 text-[14px] font-bold tracking-tight px-2.5 py-1.5 rounded-lg shrink-0 whitespace-nowrap"
                    style={{background:"var(--sand)", color:"#1B1405"}}>
                <IconTrophy size={14}/> {result.finalWinners.map(id => nameOf(id)).join(", ")}
              </span>
            )}
          </div>
          <button onClick={()=>{ if(hole>18){ setOpenLog(true); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); } else saveHole(); }}
            className="mt-2.5 w-full h-[58px] rounded-2xl flex items-center justify-center gap-2 font-black tracking-tight text-[18px] active:scale-[.99] transition-transform shadow-sm"
            style={{background:"var(--turf)", color:"#fff"}}>
            <IconSave size={20}/> {hole > 18 ? "라운드 종료 — 스코어카드 저장/공유" : hole === 18 ? "18번 홀 저장하고 마무리" : `${hole}번 홀 저장하고 다음 홀`}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
