<script type="text/babel">
const { useState, useMemo, useEffect, useRef } = React;

/* ---------- icons (lucide-style, 2px stroke) ---------- */
const Ico = ({d, size=22, fill="none", extra}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    {d.map((p,i)=><path key={i} d={p} />)}
    {extra}
  </svg>
);
const IconFlag   = p => <Ico {...p} d={["M4 22V4","M4 4h11l-1.6 3.5L15 11H4"]} />;
const IconMinus  = p => <Ico {...p} d={["M5 12h14"]} />;
const IconPlus   = p => <Ico {...p} d={["M12 5v14","M5 12h14"]} />;
const IconTrophy = p => <Ico {...p} d={["M7 4h10v5a5 5 0 0 1-10 0z","M7 6H4v1a3 3 0 0 0 3 3","M17 6h3v1a3 3 0 0 1-3 3","M10 16h4","M12 14v2","M9 20h6"]} />;
const IconChev   = p => <Ico {...p} d={["m6 9 6 6 6-6"]} />;
const IconRotate = p => <Ico {...p} d={["M3 12a9 9 0 1 0 3-6.7L3 8","M3 3v5h5"]} />;
const IconUndo   = p => <Ico {...p} d={["M9 14 4 9l5-5","M4 9h11a5 5 0 0 1 0 10h-4"]} />;
const IconSwords = p => <Ico {...p} d={["M14.5 17.5 21 11l-1-4-4-1-6.5 6.5","M3 21l4.5-4.5","M6.5 6.5 3 3l1 4 4 1","M13 13l-6 6"]} />;
const IconUsers  = p => <Ico {...p} d={["M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2","M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8","M22 20v-2a4 4 0 0 0-3-3.9","M16 3.1a4 4 0 0 1 0 7.8"]} />;
const IconSave   = p => <Ico {...p} d={["M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z","M17 21v-8H7v8","M7 3v5h8"]} />;
const IconMapPin = p => <Ico {...p} d={["M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z", "M12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"]} />;
const IconDownload = p => <Ico {...p} d={["M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4","M7 10l5 5 5-5","M12 15V3"]} />;
const IconShare  = p => <Ico {...p} d={["M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8","M16 6l-4-4-4 4","M12 2v13"]} />;

/* ---------- constants ---------- */
const IDS = ["A","B","C","D"];
const TURF = { A:"#146B3A", B:"#1F5F8B", C:"#8B4A1F", D:"#5C3B8B" };
const pairKey = (x,y) => x + "-" + y;
const allPairs = (ids) => {
  const out = [];
  for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) out.push([ids[i],ids[j]]);
  return out;
};
const SCORE_NAME = { "-3":"알바트로스","-2":"이글","-1":"버디","0":"파","1":"보기","2":"더블보기","3":"트리플보기" };
const scoreLabel = n => SCORE_NAME[String(n)] || (n>0 ? `+${n}타` : `${n}타`);
const signed = n => (n>0?`+${n}`: n<0?`${n}`:"E");

/* ---------- core logic: 1:1 상대 핸디캡 및 승점 타이브레이커 ---------- */
function judgePair(x, y, gross, hcp) {
  const h = hcp[pairKey(x,y)] || { giver:null, strokes:1 };
  let netX = gross[x], netY = gross[y];
  if (h.giver === x) netY = gross[y] - h.strokes;
  else if (h.giver === y) netX = gross[x] - h.strokes;
  const winner = netX < netY ? x : netY < netX ? y : null;
  return { x, y, netX, netY, winner, giver:h.giver, strokes:h.strokes };
}

function judgeHole(ids, gross, hcp) {
  const matches = allPairs(ids).map(([x,y]) => judgePair(x,y,gross,hcp));
  const tally = {};
  ids.forEach(id => tally[id] = { id, win:0, lose:0, tie:0, pts:0 });
  
  matches.forEach(m => {
    if (!m.winner) { tally[m.x].tie++; tally[m.y].tie++; return; }
    const loser = m.winner === m.x ? m.y : m.x;
    tally[m.winner].win++; tally[loser].lose++;
  });
  
  ids.forEach(id => tally[id].pts = tally[id].win - tally[id].lose);
  const pts = ids.map(id => tally[id].pts);
  const min = Math.min(...pts), max = Math.max(...pts);
  
  const bottom = ids.filter(id => tally[id].pts === min);
  const top    = ids.filter(id => tally[id].pts === max);
  const allSquare = (min === max);

  let finalLosers = [];
  if (!allSquare) {
    const bottomGross = bottom.map(id => gross[id]);
    const maxGrossInBottom = Math.max(...bottomGross); 
    finalLosers = bottom.filter(id => gross[id] === maxGrossInBottom);
  }

  let finalWinners = [];
  if (!allSquare) {
    const topGross = top.map(id => gross[id]);
    const minGrossInTop = Math.min(...topGross);
    finalWinners = top.filter(id => gross[id] === minGrossInTop);
  }

  return { matches, tally, finalLosers, finalWinners, allSquare };
}

/* ---------- small UI pieces ---------- */
function Chip({id, size=34}) {
  return (
    <span className="num inline-flex items-center justify-center rounded-lg font-extrabold text-white shrink-0"
          style={{background:TURF[id], width:size, height:size, fontSize:size*0.5}}>{id}</span>
  );
}

function Stepper({value, onChange, min=-4, max=8}) {
  const btn = "h-16 w-16 rounded-2xl flex items-center justify-center active:scale-95 transition-transform disabled:opacity-30";
  return (
    <div className="flex items-center gap-2">
      <button className={btn} style={{background:"var(--chip)", color:"var(--ink)"}}
              disabled={value<=min} onClick={()=>onChange(value-1)} aria-label="한 타 줄이기">
        <IconMinus size={26}/>
      </button>
      <div className="w-[68px] text-center">
        <div className="num font-extrabold leading-none" style={{fontSize:34, color: value>0?"var(--ink)":value<0?"var(--turf)":"var(--ink)"}}>
          {signed(value)}
        </div>
        <div className="text-[11px] mt-1 font-medium" style={{color:"var(--ink-soft)"}}>{scoreLabel(value)}</div>
      </div>
      <button className={btn} style={{background:"var(--chip)", color:"var(--ink)"}}
              disabled={value>=max} onClick={()=>onChange(value+1)} aria-label="한 타 늘리기">
        <IconPlus size={26}/>
      </button>
    </div>
  );
}

function HandicapRow({x, y, state, onChange}) {
  const opts = [
    { key:x,    label:`${x} 줌` },
    { key:null, label:"없음" },
    { key:y,    label:`${y} 줌` },
  ];
  return (
    <div className="flex items-center gap-3 py-3" style={{borderTop:"1px solid var(--line)"}}>
      <div className="flex items-center gap-1 w-[76px] shrink-0">
        <Chip id={x} size={28}/>
        <span style={{color:"var(--ink-soft)"}}><IconSwords size={14}/></span>
        <Chip id={y} size={28}/>
      </div>
      <div className="flex rounded-xl overflow-hidden grow" style={{border:"1px solid var(--line)"}}>
        {opts.map((o,i)=>{
          const on = state.giver === o.key;
          return (
            <button key={i} onClick={()=>onChange({...state, giver:o.key})}
              className="grow h-11 text-[13px] font-bold transition-colors"
              style={{
                background: on ? (o.key ? TURF[o.key] : "var(--chip)") : "transparent",
                color: on ? (o.key ? "#fff" : "var(--ink)") : "var(--ink-soft)",
                borderLeft: i ? "1px solid var(--line)" : "none",
              }}>{o.label}</button>
          );
        })}
      </div>
      <div className="flex items-center rounded-xl shrink-0" style={{border:"1px solid var(--line)", opacity: state.giver?1:0.35, pointerEvents: state.giver?"auto":"none"}}>
        <button className="h-11 w-9 flex items-center justify-center" onClick={()=>onChange({...state, strokes:Math.max(1,state.strokes-1)})} aria-label="핸디캡 줄이기">
          <IconMinus size={16}/>
        </button>
        <span className="num w-8 text-center font-extrabold text-[15px]">-{state.strokes}</span>
        <button className="h-11 w-9 flex items-center justify-center" onClick={()=>onChange({...state, strokes:Math.min(4,state.strokes+1)})} aria-label="핸디캡 늘리기">
          <IconPlus size={16}/>
        </button>
      </div>
    </div>
  );
}

function HoleStrip({log, hole, live, onPick, stripRef}) {
  return (
    <div ref={stripRef} className="flex gap-1 overflow-x-auto noscroll -mx-1 px-1"
         style={{scrollbarWidth:"none"}}>
      {Array.from({length:18},(_,i)=>i+1).map(n=>{
        const rec = log.find(r=>r.hole===n);
        const isNow = n === hole;
        const liveStr = live && live.length > 0 ? live.join(",") : undefined;
        const recStr = rec && rec.finalLosers && rec.finalLosers.length > 0 ? rec.finalLosers.join(",") : undefined;
        const loser = isNow ? liveStr : rec ? recStr : undefined;
        const played = isNow || !!rec;
        
        return (
          <button key={n} data-hole={n} onClick={()=>onPick(n)}
            className="shrink-0 rounded-lg flex flex-col items-center justify-center"
            style={{
              width:34, height:44,
              background: loser ? "var(--flag)" : played ? "var(--chip)" : "transparent",
              color: loser ? "#fff" : "var(--ink-soft)",
              border: isNow ? "2px solid var(--turf)" : "1px solid var(--line)",
              opacity: played ? 1 : .55,
            }}
            aria-label={`${n}번 홀${loser?` 패자 ${loser}`:""}`}>
            <span className="num text-[10px] leading-none" style={{opacity:.75}}>{n}</span>
            <span className="num text-[15px] font-extrabold leading-none mt-0.5" style={{letterSpacing: loser && loser.length > 1 ? "-1px" : "normal"}}>
              {loser ? loser : played ? "–" : ""}
            </span>
          </button>
        );
      })}
    </div>
  );
}

/* ---------- Scorecard Template (Hidden for Export) ---------- */
function ScorecardTemplate({ log, ids, names, courseName, totals, exportRef }) {
  const [dateStr, setDateStr] = useState("");
  useEffect(() => {
    // 렌더링 시점의 날짜/시간 생성
    const now = new Date();
    setDateStr(now.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }));
  }, [log]); // 로그가 업데이트 될 때마다 갱신

  const nameOf = id => names[id]?.trim() || id;

  return (
    <div style={{ position: 'absolute', top: '-9999px', left: '-9999px', pointerEvents: 'none' }}>
      <div ref={exportRef} className="p-8 bg-white text-gray-900" style={{ width: '800px', fontFamily: "'Gothic A1', sans-serif" }}>
        
        {/* 헤더 */}
        <div className="flex justify-between items-end border-b-4 pb-4 mb-6" style={{ borderColor: 'var(--turf-deep)' }}>
          <div>
            <h1 className="text-[32px] font-black tracking-tight mb-2" style={{ color: 'var(--turf-deep)' }}>WAKOI SCORECARD</h1>
            <div className="text-[15px] font-bold text-gray-500 flex items-center gap-1.5">
              <IconMapPin size={16}/> {courseName || "기록된 골프장이 없습니다"}
            </div>
          </div>
          <div className="text-right text-[15px] font-bold text-gray-500">{dateStr}</div>
        </div>
        
        {/* 요약 (패배 횟수) */}
        <div className="flex gap-4 mb-8">
           {ids.map(id => (
             <div key={id} className="flex-1 rounded-2xl p-5 text-center" style={{ backgroundColor: 'var(--chip)' }}>
                <div className="text-[20px] font-black mb-1">{nameOf(id)}</div>
                <div className="text-[13px] text-gray-500 mb-2 font-medium">단독/공동 패배</div>
                <div className="text-[32px] font-black leading-none num" style={{ color: totals[id].losses > 0 ? 'var(--flag)' : 'var(--ink)' }}>
                  {totals[id].losses}회
                </div>
             </div>
           ))}
        </div>

        {/* 18홀 테이블 */}
        <table className="w-full text-center border-collapse text-[15px]">
          <thead>
            <tr className="text-white" style={{ backgroundColor: 'var(--turf-deep)' }}>
              <th className="py-3 border-r border-white/20 w-20 font-bold">HOLE</th>
              {ids.map(id => <th key={id} className="py-3 border-r border-white/20 font-bold">{nameOf(id)}</th>)}
              <th className="py-3 font-bold w-40">이 홀의 패자</th>
            </tr>
          </thead>
          <tbody>
            {Array.from({length: 18}, (_, i) => i + 1).map(hole => {
              const rec = log.find(r => r.hole === hole);
              return (
                <tr key={hole} className="border-b" style={{ borderColor: 'var(--line)' }}>
                  <td className="py-3 font-bold bg-gray-50 border-r" style={{ borderColor: 'var(--line)' }}>{hole}</td>
                  {ids.map(id => {
                    if (!rec || !rec.ids.includes(id)) {
                      return <td key={id} className="py-3 text-gray-300 border-r" style={{ borderColor: 'var(--line)' }}>-</td>;
                    }
                    const g = rec.gross[id];
                    const p = rec.pts[id];
                    return (
                      <td key={id} className="py-3 border-r" style={{ borderColor: 'var(--line)' }}>
                        <span className="font-bold text-[16px]">{signed(g)}</span>
                        <span className="text-[12px] ml-2 num font-bold" style={{ color: p>0?'var(--turf)':p<0?'var(--flag)':'#9CA3AF' }}>
                          ({signed(p)}점)
                        </span>
                      </td>
                    );
                  })}
                  <td className="py-3 font-black" style={{ color: rec?.finalLosers?.length > 0 ? 'var(--flag)' : 'var(--ink-soft)' }}>
                    {rec?.finalLosers?.length > 0 ? rec.finalLosers.map(id => nameOf(id)).join(', ') : '-'}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        
        <div className="mt-8 text-center text-[12px] text-gray-400 font-bold">
          Generated by WAKOI 승부 계산기
        </div>
      </div>
    </div>
  );
}

/* ---------- app ---------- */
function App(){
  const [count, setCount] = useState(4);
  const ids = useMemo(()=>IDS.slice(0,count), [count]);
  const [names, setNames] = useState({A:"", B:"", C:"", D:""});
  const [courseName, setCourseName] = useState("");
  const [gross, setGross] = useState({A:0,B:0,C:0,D:0});
  const [hcp, setHcp] = useState(()=>{
    const o={}; allPairs(IDS).forEach(([x,y])=>o[pairKey(x,y)]={giver:null,strokes:1}); return o;
  });
  const [hole, setHole] = useState(1);
  const [log, setLog] = useState([]);
  const [openHcp, setOpenHcp] = useState(true);
  const [openDetail, setOpenDetail] = useState(false);
  const [openLog, setOpenLog] = useState(false);
  const stripRef = useRef(null);
  const exportRef = useRef(null);

  const nameOf = id => names[id]?.trim() || id;
  const result = useMemo(()=>judgeHole(ids, gross, hcp), [ids, gross, hcp]);

  const activeHcpCount = allPairs(ids).filter(([x,y])=>hcp[pairKey(x,y)].giver).length;

  const setGrossFor = (id,v) => setGross(s=>({...s,[id]:v}));
  const setHcpFor = (x,y,v) => setHcp(s=>({...s,[pairKey(x,y)]:v}));

  const saveHole = () => {
    if (hole > 18) return;
    setLog(l => [...l.filter(r=>r.hole!==hole), {
      hole, ids:[...ids], gross:{...gross},
      pts: Object.fromEntries(ids.map(id=>[id, result.tally[id].pts])),
      record: Object.fromEntries(ids.map(id=>[id, {...result.tally[id]}])),
      hcp: Object.fromEntries(allPairs(ids).map(([x,y])=>[pairKey(x,y), {...hcp[pairKey(x,y)]}])),
      finalLosers: result.finalLosers, finalWinners: result.finalWinners,
    }].sort((a,b)=>a.hole-b.hole));
    setHole(h=>Math.min(19, h+1));
    setGross({A:0,B:0,C:0,D:0});
    window.scrollTo({top:0, behavior:"smooth"});
  };
  
  const jumpToHole = n => {
    const rec = log.find(r=>r.hole===n);
    setHole(n);
    setGross(rec ? {A:0,B:0,C:0,D:0, ...rec.gross} : {A:0,B:0,C:0,D:0});
    if (rec) { setCount(rec.ids.length); setHcp(s=>({...s, ...rec.hcp})); }
    window.scrollTo({top:0, behavior:"smooth"});
  };
  
  const undo = () => {
    if(!log.length) return;
    const last = log[log.length-1];
    setLog(l=>l.slice(0,-1));
    setHole(last.hole);
    setGross({A:0,B:0,C:0,D:0, ...last.gross});
  };
  
  const resetAll = () => { setLog([]); setHole(1); setGross({A:0,B:0,C:0,D:0}); };

  const totals = useMemo(()=>{
    const t = Object.fromEntries(IDS.map(id=>[id,{pts:0,losses:0}]));
    log.forEach(r => { 
      Object.entries(r.pts).forEach(([id,p])=>t[id].pts+=p); 
      if(r.finalLosers) {
        r.finalLosers.forEach(id => t[id].losses++);
      }
    });
    return t;
  }, [log]);

  useEffect(()=>{
    const el = stripRef.current?.querySelector(`[data-hole="${hole}"]`);
    if (el) el.scrollIntoView({behavior:"smooth", block:"nearest", inline:"center"});
  }, [hole]);

  // 이미지 생성 및 공유/다운로드 로직
  const handleExport = async (mode) => {
    if (!exportRef.current) return;
    try {
      // html2canvas 실행
      const canvas = await window.html2canvas(exportRef.current, { 
        scale: 2, 
        useCORS: true, 
        backgroundColor: '#ffffff' 
      });
      const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
      const fileName = `WAKOI_스코어카드_${dateStr}.jpg`;

      if (mode === 'download') {
        const link = document.createElement('a');
        link.download = fileName;
        link.href = dataUrl;
        link.click();
      } else if (mode === 'share') {
        canvas.toBlob(async (blob) => {
          const file = new File([blob], fileName, { type: 'image/jpeg' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'WAKOI 스코어카드',
                text: `${courseName ? courseName : '골프장'} 라운딩 결과입니다.`,
                files: [file]
              });
            } catch(err) {
              console.log('Share canceled or failed', err);
            }
          } else {
            alert("현재 브라우저/기기에서는 직접 공유를 지원하지 않아 이미지 다운로드로 대체합니다.");
            const link = document.createElement('a');
            link.download = fileName;
            link.href = dataUrl;
            link.click();
          }
        }, 'image/jpeg', 0.9);
      }
    } catch (error) {
      console.error(error);
      alert("이미지 생성 중 오류가 발생했습니다.");
    }
  };

  const verdictColor = result.finalLosers.length > 0 ? "var(--flag)" : "var(--turf-deep)";

  return (
    <div className="min-h-screen pb-[248px]">
      
      {/* 템플릿 (보이지 않게 렌더링 후 캡처) */}
      <ScorecardTemplate log={log} ids={ids} names={names} courseName={courseName} totals={totals} exportRef={exportRef} />

      {/* header */}
      <header className="sticky top-0 z-20" style={{background:"var(--turf-deep)", color:"#F3F7F1"}}>
        <div className="max-w-md mx-auto px-4 h-16 flex items-center gap-3">
          <IconFlag size={22}/>
          <div className="grow">
            <div className="font-black text-[17px] leading-tight">홀 승부 계산기 - WAKOI</div>
            <div className="text-[11px]" style={{color:"#9EC4AC"}}>1:1 상대 핸디캡 · {ids.length}인 · 매치 {allPairs(ids).length}개</div>
          </div>
          <div className="num text-right leading-none">
            <div className="text-[10px]" style={{color:"#9EC4AC"}}>HOLE</div>
            <div className="text-[26px] font-extrabold">{hole > 18 ? "END" : hole}</div>
          </div>
        </div>
      </header>

      <main className="max-w-md mx-auto px-4">

        {/* 골프장 입력란 */}
        <div className="flex items-center gap-3 py-4 mt-2" style={{borderBottom:"1px solid var(--line)"}}>
          <span className="flex items-center gap-1.5 text-[13px] font-bold shrink-0" style={{color:"var(--ink-soft)"}}>
            <IconMapPin size={16}/> 골프장
          </span>
          <input 
            value={courseName} 
            onChange={e=>setCourseName(e.target.value)} 
            placeholder="예: 킹스데일 GC"
            className="grow bg-transparent font-bold text-[15px] outline-none text-right"
            style={{color:"var(--ink)"}} 
          />
        </div>

        {/* 인원 */}
        <div className="flex items-center gap-3 py-4">
          <span className="flex items-center gap-1.5 text-[13px] font-bold" style={{color:"var(--ink-soft)"}}>
            <IconUsers size={16}/> 참가 인원
          </span>
          <div className="flex rounded-xl overflow-hidden ml-auto" style={{border:"1px solid var(--line)"}}>
            {[3,4].map((n,i)=>(
              <button key={n} onClick={()=>setCount(n)}
                className="h-10 px-5 text-[14px] font-bold"
                style={{background: count===n?"var(--turf)":"transparent", color: count===n?"#fff":"var(--ink-soft)", borderLeft:i?"1px solid var(--line)":"none"}}>
                {n}명
              </button>
            ))}
          </div>
        </div>

        {/* 타수 입력 */}
        <section className="rounded-2xl overflow-hidden" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          {ids.map((id,i)=>{
            const isLoser = result.finalLosers.includes(id);
            const isWinner = result.finalWinners.includes(id);
            return (
              <div key={id} className="flex items-center gap-3 px-3 py-3"
                   style={{borderTop: i?"1px solid var(--line)":"none",
                           borderLeft:`6px solid ${isLoser?"var(--flag)":isWinner?"var(--sand)":TURF[id]}`,
                           background: isLoser?"color-mix(in srgb, var(--flag) 8%, var(--card))":"var(--card)"}}>
                <Chip id={id}/>
                <div className="grow min-w-0">
                  <input value={names[id]} placeholder={`플레이어 ${id}`} maxLength={6}
                    onChange={e=>setNames(s=>({...s,[id]:e.target.value}))}
                    className="w-full bg-transparent font-bold text-[16px] outline-none"
                    style={{color:"var(--ink)"}} />
                  <div className="text-[11px] font-medium mt-0.5 num" style={{color:"var(--ink-soft)"}}>
                    {result.tally[id].win}승 {result.tally[id].lose}패 {result.tally[id].tie}무
                  </div>
                </div>
                <Stepper value={gross[id]} onChange={v=>setGrossFor(id,v)} />
              </div>
            );
          })}
        </section>

        {/* 핸디캡 */}
        <section className="rounded-2xl mt-4 px-4" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <button onClick={()=>setOpenHcp(v=>!v)} className="w-full flex items-center gap-2 py-4 text-left">
            <span className="font-bold text-[15px]">핸디캡</span>
            <span className="num text-[12px] px-2 py-0.5 rounded-full font-bold"
                  style={{background:"var(--chip)", color:"var(--ink-soft)"}}>{activeHcpCount}쌍 적용</span>
            <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openHcp?"rotate(180deg)":"none"}}>
              <IconChev size={20}/>
            </span>
          </button>
          {openHcp && (
            <div className="pb-3">
              <p className="text-[12px] leading-snug pb-2" style={{color:"var(--ink-soft)"}}>
                주는 사람을 고르면 받는 사람의 타수에서 그만큼 빼고 비교합니다. 홀마다 바꿔도 됩니다.
              </p>
              {allPairs(ids).map(([x,y])=>(
                <HandicapRow key={pairKey(x,y)} x={x} y={y}
                  state={hcp[pairKey(x,y)]} onChange={v=>setHcpFor(x,y,v)} />
              ))}
            </div>
          )}
        </section>

        {/* 상세 매치업 */}
        <section className="rounded-2xl mt-4 px-4" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <button onClick={()=>setOpenDetail(v=>!v)} className="w-full flex items-center gap-2 py-4 text-left">
            <span className="font-bold text-[15px]">매치업 {result.matches.length}개 보기</span>
            <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openDetail?"rotate(180deg)":"none"}}>
              <IconChev size={20}/>
            </span>
          </button>
          {openDetail && (
            <div className="pb-3">
              {result.matches.map(m=>(
                <div key={pairKey(m.x,m.y)} className="flex items-center gap-2 py-3" style={{borderTop:"1px solid var(--line)"}}>
                  <div className="flex items-center gap-1.5 grow">
                    <Chip id={m.x} size={26}/>
                    <span className="num font-extrabold text-[15px]" style={{color: m.winner===m.x?"var(--turf)":"var(--ink-soft)"}}>{signed(m.netX)}</span>
                    <span className="text-[12px] px-1" style={{color:"var(--ink-soft)"}}>vs</span>
                    <span className="num font-extrabold text-[15px]" style={{color: m.winner===m.y?"var(--turf)":"var(--ink-soft)"}}>{signed(m.netY)}</span>
                    <Chip id={m.y} size={26}/>
                    {m.giver && (
                      <span className="text-[11px] ml-1 font-medium" style={{color:"var(--ink-soft)"}}>
                        {m.giver}→{m.giver===m.x?m.y:m.x} -{m.strokes}
                      </span>
                    )}
                  </div>
                  <span className="text-[12px] font-bold px-2.5 py-1 rounded-lg shrink-0"
                        style={{background: m.winner?"color-mix(in srgb, var(--turf) 14%, transparent)":"var(--chip)",
                                color: m.winner?"var(--turf)":"var(--ink-soft)"}}>
                    {m.winner ? `${nameOf(m.winner)} 승` : "무승부"}
                  </span>
                </div>
              ))}
            </div>
          )}
        </section>

        {/* 누적 기록 및 내보내기 */}
        <section className="rounded-2xl mt-4 p-4" style={{background:"var(--card)", border:"1px solid var(--line)"}}>
          <div className="flex items-center gap-2 mb-1">
            <span className="font-bold text-[15px]">누적 {log.length}홀</span>
            <button onClick={undo} disabled={!log.length}
              className="ml-auto flex items-center gap-1 text-[12px] font-bold px-2.5 py-1.5 rounded-lg disabled:opacity-30"
              style={{background:"var(--chip)", color:"var(--ink)"}}><IconUndo size={14}/> 되돌리기</button>
            <button onClick={resetAll}
              className="flex items-center gap-1 text-[12px] font-bold px-2.5 py-1.5 rounded-lg"
              style={{background:"var(--chip)", color:"var(--ink)"}}><IconRotate size={14}/> 초기화</button>
          </div>
          
          {log.length === 0 ? (
            <p className="text-[13px] py-2" style={{color:"var(--ink-soft)"}}>홀을 저장하면 여기에 쌓입니다.</p>
          ) : (
            <>
              <div className="flex gap-2 pt-2">
                {ids.map(id=>(
                  <div key={id} className="grow rounded-xl p-2.5 text-center" style={{background:"var(--chip)"}}>
                    <Chip id={id} size={24}/>
                    <div className="num text-[20px] font-extrabold mt-1 leading-none"
                         style={{color: totals[id].pts>0?"var(--turf)":totals[id].pts<0?"var(--flag)":"var(--ink)"}}>
                      {signed(totals[id].pts)}
                    </div>
                    <div className="text-[11px] mt-1" style={{color:"var(--ink-soft)"}}>패배 {totals[id].losses}</div>
                  </div>
                ))}
              </div>

              <button onClick={()=>setOpenLog(v=>!v)} className="w-full flex items-center gap-2 pt-4 pb-1 text-left">
                <span className="font-bold text-[14px]">홀별 상세 기록</span>
                <span className="text-[12px]" style={{color:"var(--ink-soft)"}}>타수 · 점수 · 패자</span>
                <span className="ml-auto transition-transform" style={{color:"var(--ink-soft)", transform:openLog?"rotate(180deg)":"none"}}>
                  <IconChev size={18}/>
                </span>
              </button>

              {openLog && (
                <div className="pt-1">
                  <div className="flex items-center gap-2 pb-2 text-[11px] font-bold" style={{color:"var(--ink-soft)"}}>
                    <span className="num w-8">홀</span>
                    {ids.map(id=><span key={id} className="grow text-center">{nameOf(id)}</span>)}
                    <span className="w-[54px] text-right">패자</span>
                  </div>
                  {log.map(rec=>(
                    <button key={rec.hole} onClick={()=>jumpToHole(rec.hole)}
                      className="w-full flex items-center gap-2 py-2.5 text-left active:opacity-70"
                      style={{borderTop:"1px solid var(--line)"}}>
                      <span className="num w-8 font-extrabold text-[15px]">{rec.hole}</span>
                      {ids.map(id=>{
                        const g = rec.gross?.[id], p = rec.pts?.[id];
                        const inRound = rec.ids.includes(id);
                        return (
                          <span key={id} className="grow text-center">
                            <span className="num font-bold text-[15px] block leading-none"
                                  style={{color: inRound ? "var(--ink)" : "var(--ink-soft)", opacity: inRound?1:.4}}>
                              {inRound ? signed(g) : "·"}
                            </span>
                            {inRound && (
                              <span className="num text-[10px] font-bold"
                                    style={{color: p>0?"var(--turf)":p<0?"var(--flag)":"var(--ink-soft)"}}>
                                {signed(p)}
                              </span>
                            )}
                          </span>
                        );
                      })}
                      <span className="w-[54px] flex justify-end">
                        {rec.finalLosers && rec.finalLosers.length > 0 ? (
                          <span className="num text-[12px] font-extrabold px-2 py-1 rounded-lg text-white"
                                style={{background:"var(--flag)"}}>{rec.finalLosers.join(",")}</span>
                        ) : (
                          <span className="text-[12px] font-bold px-2 py-1 rounded-lg"
                                style={{background:"var(--chip)", color:"var(--ink-soft)"}}>없음</span>
                        )}
                      </span>
                    </button>
                  ))}
                  <p className="text-[11px] pt-2.5" style={{color:"var(--ink-soft)"}}>
                    줄을 누르면 그 홀로 돌아가 타수와 핸디캡을 고칠 수 있습니다. 다시 저장하면 덮어씁니다.
                  </p>
                </div>
              )}

              {/* 스코어카드 저장 및 공유 버튼 구역 */}
              <div className="flex gap-2 pt-4 mt-4" style={{borderTop:"1px solid var(--line)"}}>
                <button onClick={()=>handleExport('download')} className="grow h-12 flex items-center justify-center gap-1.5 rounded-xl text-[14px] font-extrabold text-white active:scale-95 transition-transform" style={{backgroundColor: "var(--turf-deep)"}}>
                  <IconDownload size={18}/> 스코어카드 저장
                </button>
                <button onClick={()=>handleExport('share')} className="grow h-12 flex items-center justify-center gap-1.5 rounded-xl text-[14px] font-extrabold text-white active:scale-95 transition-transform" style={{backgroundColor: "#3B82F6"}}>
                  <IconShare size={18}/> 결과 공유
                </button>
              </div>

            </>
          )}
        </section>

      </main>

      {/* 하단 플로팅 결과 바 */}
      <div className="fixed bottom-0 left-0 right-0 z-30" style={{background:"var(--paper)", borderTop:"1px solid var(--line)"}}>
        <div className="max-w-md mx-auto px-4 pt-2.5" style={{paddingBottom:"calc(12px + env(safe-area-inset-bottom))"}}>
          <HoleStrip log={log} hole={hole} live={result.finalLosers} onPick={jumpToHole} stripRef={stripRef} />
          <div className="h-2.5" />
          <div key={`${result.finalLosers.join('-')}-${result.finalWinners.join('-')}`} className="verdict-in rounded-2xl px-4 py-3 flex items-center gap-3"
               style={{background:verdictColor, color:"#fff"}}>
            <span style={{opacity:.9}}>{result.finalLosers.length > 0 ? <IconFlag size={24}/> : <IconTrophy size={24}/>}</span>
            <div className="grow min-w-0">
              {result.finalLosers.length > 0 ? (
                <>
                  <div className="text-[11px]" style={{opacity:.85}}>
                    {result.finalLosers.length > 1 ? "이 홀의 공동 패자" : "이 홀의 단독 패자"}
                  </div>
                  <div className="font-black text-[20px] leading-tight truncate">
                    {result.finalLosers.map(id => nameOf(id)).join(", ")}
                  </div>
                </>
              ) : (
                <>
                  <div className="text-[11px]" style={{opacity:.85}}>패자 없음</div>
                  <div className="font-black text-[18px] leading-tight truncate">
                    {result.allSquare ? "올스퀘어" : "패자를 가릴 수 없음"}
                  </div>
                </>
              )}
            </div>
            {result.finalWinners.length > 0 && (
              <span className="flex items-center gap-1 text-[12px] font-bold px-2.5 py-1.5 rounded-lg shrink-0"
                    style={{background:"var(--sand)", color:"#1B1405"}}>
                <IconTrophy size={14}/> {result.finalWinners.map(id => nameOf(id)).join(", ")}
              </span>
            )}
          </div>
          <button onClick={()=>{ if(hole>18){ setOpenLog(true); window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}); } else saveHole(); }}
            className="mt-2 w-full h-14 rounded-2xl flex items-center justify-center gap-2 font-black text-[16px] active:scale-[.99] transition-transform"
            style={{background:"var(--turf)", color:"#fff"}}>
            <IconSave size={20}/> {hole > 18 ? "라운드 종료 — 스코어카드 저장/공유" : hole === 18 ? "18번 홀 저장하고 마무리" : `${hole}번 홀 저장하고 다음 홀`}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
